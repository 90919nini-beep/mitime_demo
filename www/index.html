  <style>
    /* -webkit-text-size-adjust:100% turns off iOS Safari/WKWebView's automatic
       "text autosizing" — a heuristic that boosts small text's rendered size
       based on each element's surrounding DOM context (container width,
       sibling count, etc). Without this, two elements with the identical
       explicit font-size can render at visibly different sizes depending on
       where they sit in the page, which is exactly why some filter-pill
       dropdowns looked bigger than others despite sharing the same style. */
    *{-webkit-font-smoothing:antialiased;box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%;}

    @keyframes starSpinR{0%{transform:rotate(0deg)}100%{transform:rotate(-360deg)}}
    @keyframes stickerFall{
      /* Heavy gravity: slow release → rapid acceleration → sharp impact → quick settle */
      0%  {transform:translateY(var(--fall-dist,-200px)) translateX(var(--drift-x,0px)) rotate(var(--r,0deg));opacity:0}
      5%  {transform:translateY(calc(var(--fall-dist,-200px)*.96)) translateX(calc(var(--drift-x,0px)*.96)) rotate(var(--r,0deg));opacity:1}
      22% {transform:translateY(calc(var(--fall-dist,-200px)*.80)) translateX(calc(var(--drift-x,0px)*.80)) rotate(var(--r,0deg))}
      44% {transform:translateY(calc(var(--fall-dist,-200px)*.44)) translateX(calc(var(--drift-x,0px)*.44)) rotate(var(--r,0deg))}
      60% {transform:translateY(calc(var(--fall-dist,-200px)*.09)) translateX(calc(var(--drift-x,0px)*.09)) rotate(var(--r,0deg))}
      66% {transform:translateY(0) translateX(0) rotate(var(--r,0deg)) scaleY(0.94);opacity:1}
      76% {transform:translateY(var(--bounce,-8px)) translateX(0) rotate(var(--r,0deg)) scaleY(1.02)}
      87% {transform:translateY(2px) translateX(0) rotate(var(--r,0deg)) scaleY(1)}
      100%{transform:translateY(0)   translateX(0) rotate(var(--r,0deg))}
    }

    @keyframes blobDrift1{0%,100%{transform:translate(0%,0%) scale(1)}33%{transform:translate(10%,-16%) scale(1.07)}66%{transform:translate(-8%,11%) scale(0.95)}}
    @keyframes blobDrift2{0%,100%{transform:translate(0%,0%) scale(1)}40%{transform:translate(-13%,-7%) scale(1.09)}75%{transform:translate(9%,13%) scale(0.93)}}
    @keyframes createAmb1{0%,100%{transform:translate(0px,0px) scale(1)}30%{transform:translate(-14px,10px) scale(1.06)}65%{transform:translate(8px,-12px) scale(0.96)}}
    @keyframes createAmb2{0%,100%{transform:translate(0px,0px) scale(1)}40%{transform:translate(10px,-8px) scale(1.04)}72%{transform:translate(-6px,14px) scale(0.97)}}
    @keyframes createAmb3{0%,100%{transform:translate(0px,0px) scale(1)}50%{transform:translate(-10px,6px) scale(1.03)}}
    @keyframes ambA{0%,20%{opacity:1}40%,60%{opacity:0}80%,100%{opacity:1}}
    @keyframes ambB{0%,20%{opacity:0}40%,60%{opacity:1}80%,100%{opacity:0}}
    @keyframes starPop{
      0%  {opacity:0;transform:translate(-50%,-50%) scale(0) rotate(0deg)}
      55% {opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(20deg)}
      75% {transform:translate(-50%,-50%) scale(0.9) rotate(-8deg)}
      100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg)}
    }
    @keyframes starShine{

    }
    @keyframes congratsPop{
      0%  {opacity:0;transform:translateX(-50%) scale(0.6) rotate(-4deg)}
      55% {opacity:1;transform:translateX(-50%) scale(1.08) rotate(2deg)}
      75% {transform:translateX(-50%) scale(0.97) rotate(-1deg)}
      100%{opacity:1;transform:translateX(-50%) scale(1) rotate(0deg)}
    }

      0%  {opacity:1}
      100%{opacity:0}

    .modal-in{position:relative;animation:fadeIn .2s cubic-bezier(0.32,0.72,0,1);margin-bottom:calc(-1 * env(safe-area-inset-bottom, 0px));will-change:transform;overscroll-behavior:contain;touch-action:pan-y;}
    /* iOS-style grab handle — purely decorative, signals the sheet below is swipe-to-dismiss */
    .modal-in::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:36px;height:5px;border-radius:3px;background:rgba(120,120,128,0.36);z-index:1;pointer-events:none;}
    /* The pull-bar affordance implies swipe-to-dismiss, which .no-swipe-dismiss opts out of.
       Same reasoning applies wholesale on desktop (DESKTOP_BP, see the JS constant of the
       same name): the swipe-back gesture itself only ever listens for touch events (see the
       plain <script> block below), so it's already inert for a mouse — showing a "drag me"
       hint there would just be misleading, not merely redundant. One rule here removes it
       from every .modal-in-based sheet across the app instead of touching each modal. */
    .modal-in.no-swipe-dismiss::before{display:none;}
    /* Pattern Share sheet: iOS-style pressed rows + reduced-motion opt-outs. Scoped to
       .share-sheet-in / .share-row / .share-primary so no other sheet is affected. */
    .share-row,.share-primary{-webkit-tap-highlight-color:transparent;transition:background .18s cubic-bezier(0.32,0.72,0,1),transform .18s cubic-bezier(0.32,0.72,0,1),filter .18s cubic-bezier(0.32,0.72,0,1);}
    .share-row:active:not(:disabled){background:var(--border-soft)!important;}
    .share-primary:active:not(:disabled){transform:scale(.985);filter:brightness(.96);}
    @media(prefers-reduced-motion:reduce){.share-sheet-in{animation:none!important;}.share-row,.share-primary{transition:none!important;}.share-primary:active:not(:disabled){transform:none;}}
    @media (min-width:900px){ .modal-in::before{display:none;} }
    /* Yarn Quantity sheet's number input: it sits next to custom −/+ buttons,
       so the browser's own up/down spinner is redundant clutter — hide it
       without touching type="number" appearance anywhere else in the app. */
    .qty-stepper-input::-webkit-outer-spin-button,
    .qty-stepper-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    .qty-stepper-input{-moz-appearance:textfield;}
    /* Free Canvas' typed Angle field — the preset row + slider already cover
       nudging by increments, so the native up/down spinner is redundant
       clutter that also crowds out the "-180" text in a narrow field. */
    .fcc-angle-input::-webkit-outer-spin-button,
    .fcc-angle-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
    .fcc-angle-input{-moz-appearance:textfield;}
    /* overscroll-behavior:contain on .modal-in itself only stops chaining if THAT element
       is what scrolls — most modals actually scroll a nested child div (overflow-y:auto),
       which needs its own containment or wheel/touch input "chains" past it to the page
       behind once the inner content hits its scroll bounds. Apply to every descendant so
       we don't have to hunt down and tag each modal's specific scrollable child. */
    .modal-in *{overscroll-behavior:contain;}
    body.modal-open{touch-action:none;}
    .modal-overlay{transition:none!important;will-change:opacity;}
    /* Settings is a "pushed" screen (has a Back button), not a tab — give it the
       iOS UINavigationController push/pop slide instead of the instant tab-swap cut. */
    @keyframes pagePushIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
    @keyframes pagePushOut{from{transform:translateX(0)}to{transform:translateX(100%)}}
    /* No fill-mode here (unlike page-push-out below): once the one-time entrance
       finishes it must fully release the `transform` property, otherwise the
       CSS animation keeps overriding the live inline transform the swipe-back
       gesture handler writes during a drag, and the page stops tracking the
       finger. Ending state is translateX(0) either way, so nothing visually
       changes when the animation lets go. */
    .page-push-in{animation:pagePushIn .32s cubic-bezier(0.32,0.72,0,1);will-change:transform;}
    .page-push-out{animation:pagePushOut .28s cubic-bezier(0.32,0.72,0,1) both;will-change:transform;}
    @media(prefers-reduced-motion:reduce){.page-push-in,.page-push-out{animation:none!important;}}
    @media(display-mode:standalone){.modal-in{margin-bottom:0;}}
    html.cap-native .modal-in{margin-bottom:0;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#778EE3!important;box-shadow:0 0 0 3px #778EE322;}
    input,select,textarea{outline:none;}
    /* iOS Safari/WKWebView auto-zooms the page on focus for any field under 16px —
       force it here rather than chasing every inline fontSize in the component tree. */
    input,select,textarea{font-size:16px!important;}
    ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:#E5E7EB;border-radius:99px;}
    canvas{touch-action:none;}
    /* Ancestors set touch-action:pan-y to lock modal scrolling to vertical only
       (see .modal-in above) — without this, that intersects with range inputs'
       own touch handling and WKWebView only ever registers a tap on the track,
       never a horizontal thumb-drag. Same fix as canvas above. */
    input[type="range"]{touch-action:none;}
    /* A <textarea>'s default touch-action is "auto" — iOS Safari/WKWebView
       reads a touch-drag that STARTS on one as "select this text," not "let
       the vertical scroll gesture pass through to my scrollable ancestor,"
       even when the textarea itself has nothing to scroll (rows=1,
       overflow:hidden, auto-sized to its content — every editable row in
       Review Imported Pattern/Edit Steps and similar screens). Since each
       row's textarea spans nearly the full row width, this made the whole
       CENTER column of those screens un-scrollable by touch — only the
       narrow non-textarea margins (a step number, a "..." menu button)
       still let a drag reach the actual scrollable container. pan-y here
       (matching the same fix already applied to canvas/range above)
       explicitly allows vertical panning to pass through a textarea while
       still letting a plain tap focus/edit it normally. */
    textarea{touch-action:pan-y;}
    .btn-ghost{background:none;border:none;cursor:pointer;}
    /* Belt-and-suspenders alongside the inline appearance:"none" some selects
       already set — unprefixed `appearance` only landed in Safari/WebKit
       15.4, and this app's iOS 15.0 deployment target predates that, so
       without -webkit-appearance:none older 15.x devices can fall back to
       the native control's own font rendering instead of ours. */
    select{background-image:none;-webkit-appearance:none;appearance:none;}
    /* ── Theme tokens ───────────────────────────────────────────── */
    :root{
      --bg-page:#F2F2F7;--bg-card:#FFFFFF;--bg-elevated:#FFFFFF;--bg-subtle:#F3F4F6;--bg-input:#F8F9FC;
      --border:#E5E7EB;--border-soft:#F3F4F6;
      --text-primary:#111111;--text-secondary:#6B7280;--text-muted:#374151;
      --accent:#778EE3;--accent-soft:#EEF2FF;
      --shadow:rgba(0,0,0,0.10);
      --st-ip-bg:#EEF4FF;--st-done-bg:#ECFDF5;--st-hold-bg:#FFFBEB;--st-none-bg:#F3F4F6;
      --nav-bg:rgba(255,255,255,0.94);--nav-border:#EEF0FD;
      --hero-bg:linear-gradient(145deg,#f3f0ff 0%,#e8eeff 60%,#f0f8ff 100%);
      --bg-page-clear:rgba(242,242,247,0);
      --fp-base:#f5f2ec;--fp-blob1:rgba(119,142,227,0.50);--fp-blob2:rgba(220,185,75,0.44);--fp-blob3:rgba(155,170,230,0.38);
      --fp-frost-mid:rgba(255,255,255,0.56);--fp-frost-top:rgba(255,255,255,0.64);--fp-frost-hi:rgba(255,255,255,0.80);
      /* Active-step wash in the pattern reader (StepReader) — a low-alpha tint
         over --bg-card, so it needs its own light/dark value rather than one
         fixed rgba, or it reads as a muddy dark patch once --bg-card goes dark. */
      --step-active-bg:rgba(36,123,160,0.07);
      /* Read Mode's single "notes/editing" accent (row/round note badges and
         pencil buttons in PatternViewModal/KnitSymbolReader/CPM_RoundsReader).
         #92400E is a dark amber meant to sit on the light amber wash those
         buttons use — it needs its own dark-mode value, same reasoning as
         --step-active-bg above, or it renders as near-invisible dark-on-dark. */
      --rm-note:#92400E;
    }
    [data-theme="dark"]{
      --bg-page:#161519;--bg-card:#1F1D24;--bg-elevated:#252231;--bg-subtle:#27242E;--bg-input:#2C2934;
      --border:rgba(180,165,220,0.10);--border-soft:rgba(180,165,220,0.06);
      --text-primary:#EDE9F4;--text-secondary:#9B93AE;--text-muted:#C5BCDA;
      --step-active-bg:rgba(94,201,232,0.14);
      --rm-note:#FBBF24;
      --accent:#778EE3;--accent-soft:#1D1E35;
      --shadow:rgba(0,0,0,0.35);
      --st-ip-bg:#18203A;--st-done-bg:#0F2820;--st-hold-bg:#2A1F0D;--st-none-bg:#27242E;
      --nav-bg:rgba(22,20,27,0.94);--nav-border:rgba(180,165,220,0.08);
      --hero-bg:linear-gradient(145deg,#1e1b2e 0%,#1a1827 60%,#1c1b2a 100%);
      --bg-page-clear:rgba(22,21,25,0);
      --fp-base:#1e1c2a;--fp-blob1:rgba(90,110,195,0.48);--fp-blob2:rgba(155,130,55,0.42);--fp-blob3:rgba(105,118,200,0.36);
      --fp-frost-mid:rgba(20,18,34,0.60);--fp-frost-top:rgba(20,18,34,0.68);--fp-frost-hi:rgba(55,50,78,0.70);
    }
    body{background:var(--bg-page);}
    *,*::before,*::after{transition:border-color 0.25s ease,color 0.25s ease,box-shadow 0.25s ease;}
    body,#root{transition:background-color 0.25s ease;}
    /* ── Responsive scaling: bigger UI on larger (but still mobile/tablet) screens.
       Above DESKTOP_BP (900px, see the JS constant of the same name) the app
       switches to a real desktop shell with its own composition instead of a
       scaled-up phone layout, so zoom resets to 1 there rather than continuing
       to climb — see the desktop shell / CreatePage sections of this file. ── */
    @media (min-width: 540px)  { html { zoom: 1.05; } }
    @media (min-width: 768px)  { html { zoom: 1.12; } }
    @media (min-width: 900px)  { html { zoom: 1; } }
    /* ── Modal max-height: corrected per zoom level so panels never reach the top safe area ── */
    @media (min-width: 540px)  { .modal-in { max-height: calc(85dvh - env(safe-area-inset-top, 0px)) !important; } }
    @media (min-width: 768px)  { .modal-in { max-height: calc(80dvh - env(safe-area-inset-top, 0px)) !important; } }
    @media (min-width: 1024px) { .modal-in { max-height: calc(78dvh - env(safe-area-inset-top, 0px)) !important; } }
    @media (min-width: 1400px) { .modal-in { max-height: calc(74dvh - env(safe-area-inset-top, 0px)) !important; } }
    /* ── Splash screen ── */
    #splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;overflow:hidden;transition:opacity 0.5s ease;background:radial-gradient(ellipse at 60% 40%,#dfe3f5 0%,#eceef8 60%,#e8e4f0 100%);}
    #splash.sp-dark{background:radial-gradient(ellipse at 60% 40%,#1e1a32 0%,#161519 60%,#1c1628 100%);}
    #splash.sp-out{opacity:0;pointer-events:none;transition:opacity 0.5s ease;}
    .sp-blob1{position:absolute;top:-80px;right:-80px;width:280px;height:280px;border-radius:50%;filter:blur(70px);background:#c5cdf5;opacity:0.6;}
    .sp-blob2{position:absolute;bottom:-80px;left:-80px;width:260px;height:260px;border-radius:50%;filter:blur(60px);background:#d4c5f5;opacity:0.5;}
    #splash.sp-dark .sp-blob1{background:#2d2560;opacity:0.45;}
    #splash.sp-dark .sp-blob2{background:#3a1f5e;opacity:0.35;}
    .sp-logo{width:170px;position:relative;z-index:1;animation:fadeUp 0.7s ease both;}
    .sp-tagline{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;letter-spacing:0.04em;position:relative;z-index:1;display:flex;align-items:center;gap:6px;animation:fadeUp 0.7s 0.2s ease both;color:#778EE3;}
    #splash.sp-dark .sp-tagline{color:#9B93AE;}
    .sp-dots-wrap{display:inline-flex;align-items:center;gap:3px;}
    .sp-dot{width:5px;height:5px;border-radius:50%;background:#778EE3;opacity:0;transition:opacity 0.2s ease;}
    #splash.sp-dark .sp-dot{background:#9B93AE;}
    .sp-dot.on{opacity:1;}

    /* Onboarding entrance animations — ported verbatim (durations/easings/
       transforms) from the finished "miiitime Onboarding (Standalone)"
       prototype. Only the keyframes actually used by the surviving 6 screens
       are included; the prototype's dev-only [data-motion] speed variants
       (calm/playful) are intentionally not ported — one fixed feel, matching
       the rest of the app having no motion-speed setting. */
    @keyframes mitimeFadeUp { 0%{opacity:0;transform:translateY(12px);} 100%{opacity:1;transform:translateY(0);} }
    @keyframes mitimeFadeDown { 0%{opacity:0;transform:translateY(-6px);} 100%{opacity:1;transform:translateY(0);} }
    @keyframes mitimeFade { 0%{opacity:0;} 100%{opacity:1;} }
    @keyframes mitimePop { 0%{opacity:0;transform:scale(0.6);} 65%{opacity:1;transform:scale(1.08);} 100%{transform:scale(1);} }
    @keyframes mitimeTwinkle { 0%,100%{transform:scale(1) rotate(0deg);opacity:1;} 50%{transform:scale(1.25) rotate(10deg);opacity:0.7;} }
    @keyframes mitimeFloat { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px);} }
    @keyframes mitimeFill { 0%{transform:scaleX(0);} 100%{transform:scaleX(1);} }
    @keyframes mitimeDotPulse { 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.35);opacity:0.8;} }
    .anim-fade-up{opacity:0;animation:mitimeFadeUp 1.15s cubic-bezier(0.2,0.7,0.3,1) forwards;}
    .anim-fade-down{opacity:0;animation:mitimeFadeDown 1.1s cubic-bezier(0.2,0.7,0.3,1) forwards;}
    .anim-fade{opacity:0;animation:mitimeFade 1.2s ease forwards;}
    .anim-pop{animation:mitimePop 1.0s cubic-bezier(0.34,1.56,0.64,1);}
    .anim-float{animation:mitimeFloat 3.8s ease-in-out infinite;}
    .anim-twinkle{animation:mitimeTwinkle 3.4s ease-in-out infinite;}
    .anim-fill{transform-origin:left;animation:mitimeFill 1.7s 0.25s cubic-bezier(0.2,0.7,0.3,1) backwards;}
    .anim-dot-pulse{animation:mitimeDotPulse 2.4s ease-in-out infinite;}
    .tap{transition:transform 0.12s ease,box-shadow 0.2s ease;}
    .tap:active{transform:scale(0.97);}
    /* ── Desktop shell hover feedback ── mouse-only affordance for the
       sidebar nav rows and the new desktop-only CreatePage tiles; deliberately
       just a hairline lift + shadow bump, no bounce/spring — matches the
       restrained, non-decorative motion used everywhere else in this file. */
    .desk-tile{transition:transform 0.15s ease,box-shadow 0.15s ease,border-color 0.15s ease;}
    .desk-nav-row{transition:background-color 0.15s ease,color 0.15s ease;}
    /* Gated behind a real-mouse media query — the desktop shell also renders
       on touch devices wide enough to cross DESKTOP_BP (iPad landscape is
       ~1024-1194px), where a :hover rule would otherwise stick a "hovered"
       tile/row in place after every tap since touch has no hover-out. */
    @media (hover:hover) and (pointer:fine){
      .desk-tile:hover{transform:translateY(-2px);}
      .desk-nav-row:hover{background:var(--bg-subtle)!important;}
      .desk-nav-row.active:hover{background:var(--accent-soft)!important;}
    }
  </style>
</head>
<body>
<div id="splash">
  <div class="sp-blob1"></div>
  <div class="sp-blob2"></div>
  <img class="sp-logo" src="primary_logo.svg" alt="mitime"/>
  <div class="sp-tagline" id="sp-tagline">
    <span id="sp-text"></span>
    <span class="sp-dots-wrap">
      <span class="sp-dot" id="sp-d1"></span>
      <span class="sp-dot" id="sp-d2"></span>
      <span class="sp-dot" id="sp-d3"></span>
    </span>
  </div>
</div>
<script>
(function(){
  // On iOS, NativeSplashViewController already shows an equivalent native splash
  // (logo, random tagline, cycling dots) before the WebView even starts loading,
  // and keeps it up for its own minimumDuration. If this web splash also ran its
  // full duration on top of that, launch would show two splashes back to back.
  // So: skip this one entirely when running inside the native shell.
  try {
    if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) {
      // display-mode:standalone (below) only matches an installed PWA, not this
      // native WKWebView shell — without this class, .modal-in's negative
      // margin-bottom stays active here and eats the safe-area padding every
      // bottom sheet adds for its last row, leaving it flush against the home
      // indicator with almost no clearance.
      document.documentElement.classList.add("cap-native");
      var nativeSplash = document.getElementById("splash");
      if (nativeSplash) nativeSplash.style.display = "none";
      // Tell AppDelegate's NativeSplashViewController it's safe to hand off —
      // it waits for this (plus its own minimum branded duration) before
      // swapping away from the splash, so it never cuts to a still-blank
      // WebView. "load" fires once this whole page (including the inline
      // app script) has run, which is a reasonable proxy for "rendered".
      window.addEventListener("load", function() {
        try { window.webkit.messageHandlers.nativeSplashReady.postMessage("ready"); } catch(e) {}
      });
      return;
    }
  } catch(e) {}

  var SPLASH_DURATION = 2500; // ms the splash stays fully visible
  var FADE_DURATION   = 500;  // ms for the fade-out (must match CSS transition)

  // Record when this script first ran so we can guarantee SPLASH_DURATION
  // even if DOMContentLoaded fires later on slow connections
  var startTime = Date.now();

  // 1. Apply theme immediately so there is no flash of wrong theme.
  // "auto" (also the default for a fresh install, no settings saved yet) resolves
  // against the system appearance here too, so the splash matches whatever the
  // app itself will resolve to a moment later — no light/dark mismatch flash.
  try {
    var s = JSON.parse(localStorage.getItem("sc_settings") || "{}");
    var el = document.getElementById("splash");
    var resolvedTheme = s.theme;
    if (!resolvedTheme || resolvedTheme === "auto") {
      resolvedTheme = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    if (el) el.classList.add(resolvedTheme === "dark" ? "sp-dark" : "sp-light");
  } catch(e) {}

  // 2. Pick a random tagline
  try {
    var tags = [
      "make something beautiful",
      "your makes, your way",
      "craft your story",
      "stitch by stitch",
      "for the love of making"
    ];
    var textEl = document.getElementById("sp-text");
    if (textEl) textEl.textContent = tags[Math.floor(Math.random() * tags.length)];
  } catch(e) {}

  // 2b. Cycle the loading dots • → •• → ••• → (none) → •, every 500ms
  var dotsTimer;
  try {
    var dots = [document.getElementById("sp-d1"), document.getElementById("sp-d2"), document.getElementById("sp-d3")];
    var dotStep = 0;
    function updateDots() {
      dots.forEach(function(d, i) { if (d) d.classList.toggle("on", i < dotStep); });
      dotStep = (dotStep + 1) % 4;
    }
    setTimeout(function() {
      updateDots();
      dotsTimer = setInterval(updateDots, 500);
    }, 900); // starts once the tagline fade-in (0.2s delay + 0.7s duration) finishes
  } catch(e) {}

  // 3. Hide splash — waits for the remainder of SPLASH_DURATION from startTime,
  //    so the visible duration is always at least SPLASH_DURATION regardless of
  //    when this function is called
  function hideSplash() {
    var elapsed   = Date.now() - startTime;
    var remaining = Math.max(0, SPLASH_DURATION - elapsed);
    setTimeout(function() {
      var splash = document.getElementById("splash");
      if (!splash) return;
      // Start fade-out
      splash.classList.add("sp-out");
      // Fully remove after fade completes
      setTimeout(function() {
        if (splash) splash.style.display = "none";
        if (dotsTimer) clearInterval(dotsTimer);
      }, FADE_DURATION + 50); // +50ms buffer so fade fully completes
    }, remaining);
  }

  // 4. Trigger hide once the DOM is ready (React will be bootstrapping at this point).
  //    Using DOMContentLoaded instead of running immediately prevents the timer from
  //    starting before the page has parsed — important on slow mobile connections.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", hideSplash);
  } else {
    // Already past DOMContentLoaded (e.g. script was deferred)
    hideSplash();
  }
})();
</script>
<script>
// iOS-style swipe-down-to-dismiss for every bottom sheet in the app. Implemented
// once here via event delegation on document, rather than inside each modal
// component — every current and future ".modal-in" sheet gets it automatically,
// since it's a plain DOM convention (className="modal-in") shared across all of
// them, not something wired per-component.
(function(){
  var DISMISS_DISTANCE = 120;   // px dragged down before it counts as a dismiss
  var DISMISS_VELOCITY = 0.5;   // px/ms — a fast flick dismisses even if short
  var el = null, backdrop = null, sheetHeight = 0, baseAlpha = 0.5;
  var startX = 0, startY = 0, lastY = 0, startTime = 0, dragging = false;

  function findSheet(target){
    while(target && target !== document.body){
      if(target.classList && target.classList.contains("modal-in")){
        // Opt-out escape hatch: a sheet can keep the other .modal-in benefits
        // (entrance animation, scroll-lock exemption, the cap-native safe-area
        // fix) while still declining swipe-to-dismiss, e.g. when it should
        // only be closeable via an explicit close button.
        return target.classList.contains("no-swipe-dismiss") ? null : target;
      }
      target = target.parentElement;
    }
    return null;
  }

  // Different sheets use different base backdrop darkness (rgba(0,0,0,X) with
  // X ranging roughly 0.18-0.6 across the app) — read the ACTUAL starting
  // alpha off the real element rather than assuming one fixed value, so the
  // fade always starts from wherever that sheet's backdrop actually began.
  function readAlpha(node){
    var c = window.getComputedStyle(node).backgroundColor;
    var m = c && c.match(/rgba?\([^)]+,\s*([\d.]+)\)/);
    return m ? parseFloat(m[1]) : 0.5;
  }

  // Don't hijack the gesture if it starts inside a scrollable area that isn't
  // already scrolled to its top — that touch should scroll content, not drag
  // the whole sheet. Matches how native iOS sheets behave (pull-to-dismiss only
  // engages once you're already at the top of the scrollable content).
  function startsInsideScrolledContent(target, sheet){
    while(target && target !== sheet){
      if(target.scrollHeight > target.clientHeight){
        var style = window.getComputedStyle(target);
        if((style.overflowY === "auto" || style.overflowY === "scroll") && target.scrollTop > 0) return true;
      }
      target = target.parentElement;
    }
    return false;
  }

  document.addEventListener("touchstart", function(e){
    var sheet = findSheet(e.target);
    if(!sheet || startsInsideScrolledContent(e.target, sheet)){ el = null; return; }
    el = sheet;
    backdrop = sheet.parentElement;
    sheetHeight = sheet.offsetHeight || window.innerHeight;
    baseAlpha = backdrop ? readAlpha(backdrop) : 0.5;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    lastY = startY;
    startTime = Date.now();
    dragging = false;
  }, {passive:true});

  document.addEventListener("touchmove", function(e){
    if(!el) return;
    var t = e.touches[0];
    lastY = t.clientY;
    var dy = lastY - startY, dx = t.clientX - startX;
    if(dy <= 0 || Math.abs(dx) > Math.abs(dy)){
      // Moving up, or predominantly sideways (e.g. a horizontal carousel) — not a dismiss drag.
      if(dragging){
        el.style.transition = ""; el.style.transform = "";
        // Restoring to baseAlpha, not "" — clearing the longhand background-color
        // back to empty doesn't fall back to the shorthand `background: rgba(...)`
        // React originally set (mixing shorthand + longhand inline-style writes
        // doesn't compose that way), it just leaves the backdrop transparent.
        if(backdrop){ backdrop.style.transition = ""; backdrop.style.backgroundColor = "rgba(0,0,0," + baseAlpha + ")"; }
        dragging = false;
      }
      return;
    }
    dragging = true;
    el.style.transition = "none";
    el.style.transform = "translateY(" + dy + "px)";
    if(backdrop){
      backdrop.style.transition = "none";
      backdrop.style.backgroundColor = "rgba(0,0,0," + (baseAlpha * Math.max(0, 1 - dy / sheetHeight)) + ")";
    }
  }, {passive:true});

  document.addEventListener("touchend", function(){
    if(!el) return;
    var sheet = el, sheetBackdrop = backdrop, wasDragging = dragging;
    var dy = lastY - startY;
    var velocity = dy / Math.max(Date.now() - startTime, 1);
    el = null; backdrop = null; dragging = false;
    if(!wasDragging) return;
    sheet.style.transition = "transform .25s cubic-bezier(0.32,0.72,0,1)";
    if(sheetBackdrop) sheetBackdrop.style.transition = "background-color .25s cubic-bezier(0.32,0.72,0,1)";
    if(dy > DISMISS_DISTANCE || velocity > DISMISS_VELOCITY){
      sheet.style.transform = "translateY(100%)";
      if(sheetBackdrop) sheetBackdrop.style.backgroundColor = "rgba(0,0,0,0)";
      setTimeout(function(){ if(sheetBackdrop) sheetBackdrop.click(); }, 180);
    }else{
      sheet.style.transform = "";
      if(sheetBackdrop) sheetBackdrop.style.backgroundColor = "rgba(0,0,0," + baseAlpha + ")";
    }
  });
})();
</script>
<script>
// iOS-style "swipe from the left edge to go back" for full-screen pages that
// opt in via className="swipe-back-page" (Settings, the pattern detail card,
// and any future page following the same convention). Mirrors the swipe-down
// dismiss system above: rather than knowing each page's own exit mechanics
// (Settings needs an animated exit + delayed state change; the pattern card
// just closes instantly), it finds whatever element the page has marked
// data-close-trigger — its actual Back/close button — and clicks it.
//
// If the page's immediate parent has className="swipe-back-backdrop" (both
// Settings and the pattern card wrap their page in one), that backdrop's dark
// tint is faded live in step with the drag — dark at the start, fading to
// fully transparent by the time the page has slid all the way off-screen —
// instead of staying at constant darkness until the gesture completes.
// This fades the backdrop's own background-color alpha, NOT its `opacity`
// property — `opacity` composites the whole subtree (including the solid
// page panel nested inside it) as one translucent group, which made the
// page itself go see-through mid-drag instead of staying solid while only
// the scrim behind it lightens.
(function(){
  var EDGE_ZONE = 24;          // px from the left screen edge the gesture must start within
  var DISMISS_DISTANCE = 100;  // px dragged right before it counts as "go back"
  var DISMISS_VELOCITY = 0.45; // px/ms — a fast flick goes back even if short
  var el = null, backdrop = null, pageWidth = 0;
  var startX = 0, startY = 0, lastX = 0, startTime = 0, dragging = false;

  function findPage(target){
    while(target && target !== document.body){
      if(target.classList && target.classList.contains("swipe-back-page")) return target;
      target = target.parentElement;
    }
    return null;
  }

  document.addEventListener("touchstart", function(e){
    var t = e.touches[0];
    if(t.clientX > EDGE_ZONE){ el = null; return; }
    var page = findPage(e.target);
    if(!page){ el = null; return; }
    el = page;
    backdrop = (page.parentElement && page.parentElement.classList.contains("swipe-back-backdrop")) ? page.parentElement : null;
    pageWidth = page.offsetWidth || window.innerWidth;
    startX = t.clientX; startY = t.clientY; lastX = startX;
    startTime = Date.now();
    dragging = false;
  }, {passive:true});

  document.addEventListener("touchmove", function(e){
    if(!el) return;
    var t = e.touches[0];
    lastX = t.clientX;
    var dx = lastX - startX, dy = t.clientY - startY;
    if(dx <= 0 || Math.abs(dy) > Math.abs(dx)){
      // Moving left, or predominantly vertical (e.g. scrolling the page's
      // own content) — not a go-back drag.
      if(dragging){
        el.style.transition = ""; el.style.transform = "";
        // Restoring to the same rgba(0,0,0,.5) every swipe-back-backdrop is
        // rendered with, not "" — clearing the longhand background-color back
        // to empty doesn't fall back to the shorthand `background: rgba(...)`
        // React originally set, it just leaves the backdrop transparent.
        if(backdrop){ backdrop.style.transition = ""; backdrop.style.backgroundColor = "rgba(0,0,0,.5)"; }
        dragging = false;
      }
      return;
    }
    dragging = true;
    el.style.transition = "none";
    el.style.transform = "translateX(" + dx + "px)";
    if(backdrop){
      backdrop.style.transition = "none";
      backdrop.style.backgroundColor = "rgba(0,0,0," + (0.5 * Math.max(0, 1 - dx / pageWidth)) + ")";
    }
  }, {passive:true});

  document.addEventListener("touchend", function(){
    if(!el) return;
    var page = el, pageBackdrop = backdrop, wasDragging = dragging;
    var dx = lastX - startX;
    var velocity = dx / Math.max(Date.now() - startTime, 1);
    el = null; backdrop = null; dragging = false;
    if(!wasDragging) return;
    var transition = "transform .25s cubic-bezier(0.32,0.72,0,1)";
    page.style.transition = transition;
    if(pageBackdrop) pageBackdrop.style.transition = "background-color .25s cubic-bezier(0.32,0.72,0,1)";
    if(dx > DISMISS_DISTANCE || velocity > DISMISS_VELOCITY){
      page.style.transform = "translateX(100%)";
      if(pageBackdrop) pageBackdrop.style.backgroundColor = "rgba(0,0,0,0)";
      var trigger = page.querySelector("[data-close-trigger]");
      setTimeout(function(){
        if(!trigger) return;
        // Tell the trigger's own onClick this close was already animated (the
        // translateX(100%) slide just above). A page whose trigger *also* runs
        // its own animated-exit-then-close (Settings is the one page that
        // does — see setSettingsExiting in App) would otherwise re-animate a
        // second time on top of this one: the moment its exit CSS class/
        // animation starts, it starts from its own 0% state, snapping the
        // already-slid-out page back into view before sliding it out again.
        // A plain instant-close trigger (every other swipe-back-page) just
        // ignores this flag, so this is a no-op for them.
        window.__swipeBackClosing = true;
        trigger.click();
        window.__swipeBackClosing = false;
      }, 180);
    }else{
      page.style.transform = "";
      if(pageBackdrop) pageBackdrop.style.backgroundColor = "rgba(0,0,0,.5)";
    }
  });
})();
</script>
